var CONTENT={"es": {"funciona": "<p><strong>Dos años comunes para construir la base, dos años para especializarse.<\/strong> El grado tiene 240 ECTS: los dos primeros cursos y parte del tercero son iguales para todos; a partir del 5.º semestre cada estudiante elige mención o itinerario libre.<\/p>\n<div class=\"tbl\"><table><tr><th>Bloque<\/th><th>ECTS<\/th><th>Cuándo<\/th><\/tr><tr><td>Formación básica<\/td><td>60<\/td><td>1.º<\/td><\/tr><tr><td>Obligatorias comunes<\/td><td>87<\/td><td>2.º y 3.º<\/td><\/tr><tr><td>Mención y optativas<\/td><td>87<\/td><td>3.º y 4.º<\/td><\/tr><tr><td>Trabajo de Fin de Grado<\/td><td>6<\/td><td>4.º, primavera<\/td><\/tr><\/table><\/div>\n<p><em>Documento basado en la propuesta provisional del 23/09/2026. Los temarios, la evaluación y algunas optativas aún se están debatiendo.<\/em><\/p>\n<h2 id=\"f-mapa-del-grado\">Mapa del grado<\/h2>\n<figure class=\"w\" data-w=\"mapa\"><div class=\"mount\"><\/div><figcaption>Propuesta del 23/09/2026 · 8 semestres, 240 ECTS<\/figcaption><\/figure>\n<p>Cada laboratorio es una asignatura independiente de 3 ECTS que se matricula aparte de la teoría: Lab Ia, Ib e Ic en 2.º (Mecánica, EM y Termodinámica) y Lab IIa e IIb en 3.º (Óptica y Cuántica). Qué laboratorio ocupa cada franja está por decidir.<\/p>\n<h2 id=\"f-las-materias-troncales\">Las materias troncales<\/h2>\n<figure class=\"w\" data-w=\"tronc\"><div class=\"mount\"><\/div><figcaption>Propuesta del 23/09/2026 · materias del tronco común, semestres 1–6<\/figcaption><\/figure>\n<ul><li><strong>Fonaments<\/strong> son un primer contacto más cualitativo con toda la física clásica.<\/li><li><strong>Mecánica y Electromagnetismo<\/strong> pasan de 7,5 a 12 ECTS de teoría: Mecánica conserva todo su contenido actual y gana profundidad; EM absorbe parte de lo que deja Fonaments y amplía ondas y propagación.<\/li><li><strong>Óptica y Termodinámica<\/strong> pasan a 9 ECTS de teoría.<\/li><li><strong>Cuántica II<\/strong> (≈ la actual Mecànica Quàntica) pasa a ser común.<\/li><li>Cada laboratorio vale <strong>3 ECTS<\/strong> y se matricula aparte.<\/li><\/ul>\n<h2 id=\"f-como-se-construye-una-mencion\">Cómo se construye una mención<\/h2>\n<figure class=\"w\" data-w=\"mencio\"><div class=\"mount\"><\/div><figcaption>Propuesta del 23/09/2026 · estructura del espacio optativo<\/figcaption><\/figure>\n<h2 id=\"f-las-cinco-menciones\">Las cinco menciones<\/h2>\n<div class=\"tbl\"><table><tr><th>Mención<\/th><th>Obligatorias de mención<\/th><th>ECTS<\/th><th>Optativas mín.<\/th><\/tr><tr><td><strong>Astrofísica<\/strong><\/td><td>Mecànica Teòrica · Relativitat Especial i Camps Clàssics · Astrofísica estel·lar · Física Atòmica i Molecular · Astrofísica galàctica i extragalàctica · Plasmes i Processos Astrofísics · Astrofísica observacional · Cosmologia<\/td><td>39<\/td><td>21<\/td><\/tr><tr><td><strong>Física del Sistema Terra<\/strong><\/td><td>Física de medis continus · Física de l’atmosfera · Geofísica · Dinàmica de fluids geofísics · Geodinàmica · Fon. Científics del Canvi Climàtic · Sistemes complexos i física interdisciplinària<\/td><td>36<\/td><td>24<\/td><\/tr><tr><td><strong>Matèria Condensada i Sistemes Complexos<\/strong><\/td><td>Física de medis continus · Mecànica Teòrica · Física de l’Estat Sòlid · Fenòmens Col·lectius i Transicions de Fase · Lab. Estat Sòlid · Sistemes Fora de l’Equilibri · Sistemes complexos i física interdisciplinària<\/td><td>39<\/td><td>21<\/td><\/tr><tr><td><strong>Quàntica i Interaccions Fonamentals<\/strong><\/td><td>Relativitat Especial i Camps Clàssics · Mecànica Teòrica · Física Atòmica i Molecular · Física Nuclear i Hadrònica · Física de Partícules · Laboratori de menció<\/td><td>36<\/td><td>24<\/td><\/tr><tr><td><strong>Tecnologies Físiques<\/strong><\/td><td>Instrumentació Física · Física de l’Estat Sòlid · Física Atòmica i Molecular · Fotònica · Física de Semiconductors · Laboratori de Tecnologies Físiques<\/td><td>36<\/td><td>24<\/td><\/tr><\/table><\/div>\n<p>Muchas asignaturas se repiten entre menciones (Mecànica Teòrica en tres, Física Atòmica i Molecular en tres). Eso es lo que permite cambiar de mención sin perder créditos.<\/p>\n<p>Abreviaturas usadas más abajo: <strong>Astro<\/strong> = Astrofísica · <strong>Terra<\/strong> = Física del Sistema Terra · <strong>MCSC<\/strong> = Matèria Condensada i Sistemes Complexos · <strong>QIF<\/strong> = Quàntica i Interaccions Fonamentals · <strong>TF<\/strong> = Tecnologies Físiques.<\/p>\n<h3 id=\"f-que-comparten-las-menciones\">Qué comparten las menciones<\/h3>\n<figure class=\"w\" data-w=\"euler\"><span class=\"live\">interactivo<\/span><div class=\"mount\"><\/div><figcaption>Diagrama de Euler a partir de las tablas de mención del 23/09/2026 · 46 asignaturas; posiciones verificadas para que cada asignatura quede solo dentro de los conjuntos a los que pertenece<\/figcaption><\/figure>\n<p>Cómo leerlo: pulsa las menciones de la leyenda para mostrar solo las que quieras comparar (por ejemplo, Astrofísica y Quàntica); las asignaturas que no pertenecen a ninguna seleccionada quedan en gris y el contador indica cuántas comparten. Cada asignatura está dentro de los contornos de todas las menciones a las que pertenece. Si además cae en la zona sombreada de una mención, es obligatoria en ella. Atòmica i Molecular, en el centro, está en las cinco.<\/p>\n<figure class=\"w\" data-w=\"red\"><div class=\"mount\"><\/div><figcaption>Tablas de mención de la presentación del 23/09/2026 · 46 asignaturas de mención<\/figcaption><\/figure>\n<figure class=\"w\" data-w=\"matriz\"><div class=\"mount\"><\/div><figcaption>Tablas de mención de la presentación del 23/09/2026; “Mètodes Matemàtics Avançats” de Terra se asigna a MMA I<\/figcaption><\/figure>\n<p>Las asignaturas de arriba son las que conectan menciones: Física Atòmica i Molecular está en las cinco y Mecànica Teòrica en cuatro. Las de abajo son las que dan identidad a cada una.<\/p>\n<p>Además de las 46 asignaturas de mención hay <strong>optativas transversales<\/strong>, que no pertenecen a ninguna mención y cuentan como créditos libres: Història de la Física (6), Pràctiques en Empresa (6), Gènere, Ciència i Tecnologia (3) y, por confirmar, Didàctica de la Ciència (3). Fonaments Científics del Canvi Climàtic (3), obligatoria en Terra, también se ofrece como transversal.<\/p>\n<h2 id=\"f-cambiar-de-mencion\">Cambiar de mención<\/h2>\n<figure class=\"w\" data-w=\"viab\"><span class=\"live\">interactivo<\/span><div class=\"mount\"><\/div><figcaption>Calculado a partir de las tablas de mención e itinerarios de la presentación del 23/09/2026; no incluye las optativas de 3.º<\/figcaption><\/figure>\n<ul><li><strong>Cómo leerla:<\/strong> pulsa el botón del momento del cambio (tras el 5.º o tras el 6.º semestre). Fila = mención en la que empezó el estudiante; columna = a la que quiere cambiar. Cada celda dice cuántos ECTS de las asignaturas fijas de mención ya cursadas siguen contando.<\/li><li><strong>Tras el 5.º semestre<\/strong> el cambio es viable en las 20 combinaciones: solo se han cursado 6–12 ECTS de mención y quedan 75 ECTS optativos.<\/li><li><strong>Tras el 6.º semestre<\/strong> es viable en 18 de 20: solo fallan Terra → QIF y Terra → TF.<\/li><li>Lo que no cuenta para la nueva mención no se pierde: va a los 27 ECTS libres.<\/li><li>Si el cambio llega tarde y no se completan los 60 ECTS, queda el <strong>itinerario libre<\/strong>: se obtiene el título con los mismos conocimientos, sin el nombre de la mención.<\/li><li>Las optativas de 3.º que elija el estudiante pueden mejorar mucho estas cifras si ya duda entre dos menciones.<\/li><\/ul>\n<h2 id=\"f-laboratorios\">Laboratorios<\/h2>\n<figure class=\"w\" data-w=\"labs\"><div class=\"mount\"><\/div><figcaption>Propuesta del 23/09/2026; la progresión de autonomía es una propuesta en debate<\/figcaption><\/figure>\n<p>Cada laboratorio es una asignatura propia de 3 ECTS, no anual, para que quien repite una asignatura no quede descuadrado. Requisito previsto: estar matriculado o haber superado la teoría correspondiente. La franja de cada laboratorio y el reparto de prácticas aún se están decidiendo.<\/p>\n<h2 id=\"f-que-esta-aun-en-debate\">Qué está aún en debate<\/h2>\n<div class=\"tbl\"><table><tr><th>Tema<\/th><th>Qué está decidido<\/th><th>Qué falta<\/th><\/tr><tr><td>Fonaments I y II<\/td><td>Serán más cualitativos (“tast”)<\/td><td>Qué temas se reducen y cómo<\/td><\/tr><tr><td>Temarios y planes docentes<\/td><td>Créditos por asignatura<\/td><td>Contenidos, coordinación entre asignaturas y evaluación<\/td><\/tr><tr><td>Matemáticas<\/td><td>42 ECTS obligatorios<\/td><td>Enfoque, orden de contenidos, peso de probabilidad y variable compleja<\/td><\/tr><tr><td>Laboratorios<\/td><td>3 ECTS por bloque, matrícula aparte<\/td><td>Qué laboratorio (Ia–IIb) va en cada franja, prerrequisito con la parte I o II de la teoría y reparto de prácticas<\/td><\/tr><tr><td>Optativas<\/td><td>Baterías de cada mención<\/td><td>Algunas optativas no ligadas a mención pueden caer o cambiar de créditos<\/td><\/tr><tr><td>Calendario<\/td><td>Semestre de cada asignatura (provisional)<\/td><td>Ajustar las que cambian de cuatrimestre según la mención<\/td><\/tr><\/table><\/div>", "ftoc": [["f-mapa-del-grado", "Mapa del grado"], ["f-las-materias-troncales", "Las materias troncales"], ["f-como-se-construye-una-mencion", "Cómo se construye una mención"], ["f-las-cinco-menciones", "Las cinco menciones"], ["f-cambiar-de-mencion", "Cambiar de mención"], ["f-laboratorios", "Laboratorios"], ["f-que-esta-aun-en-debate", "Qué está aún en debate"]], "valoracion": "<p><strong>Veredicto: diseño coherente y defendible; los riesgos son de ejecución, no de concepto.<\/strong><\/p>\n<ul><li><strong>Apuesta:<\/strong> menos física de panorama en el tronco, más profundidad en las clásicas, laboratorio con peso real y mucha optatividad.<\/li><li><strong>Lo que funciona:<\/strong> laboratorios de 3 ECTS, Mecánica y EM de 12 ECTS, Cuántica II para todos, menciones porosas (cambio viable en 18 de 20 pares).<\/li><li><strong>Lo que hay que cerrar:<\/strong> secuenciación y enfoque de matemáticas, orden y coste de laboratorios, coordinación de temarios, parrilla horaria y transición entre planes.<\/li><\/ul>\n<h2 id=\"v-el-cambio-en-un-grafico\">El cambio en un gráfico<\/h2>\n<figure class=\"w\" data-w=\"dumbbell\"><div class=\"mount\"><\/div><figcaption>Ficha del grado y planes docentes UB 2026-27; presentación del 23/09/2026<\/figcaption><\/figure>\n<h2 id=\"v-fortalezas\">Fortalezas<\/h2>\n<div class=\"tbl\"><table><tr><th>Qué<\/th><th>Por qué importa<\/th><\/tr><tr><td>Laboratorio de 3 ECTS propio<\/td><td>Hoy vale ≈1,5 ECTS diluidos en la teoría; ahora se reconoce y se evalúa<\/td><\/tr><tr><td>Mecánica y EM a 12 ECTS, Óptica y Termo a 9<\/td><td>Más profundidad (antes 7,5 de teoría); Mecánica conserva todo y añade<\/td><\/tr><tr><td>Cuántica I (2.º) + II (3.º) para todos<\/td><td>Hoy media promoción acaba con 6 ECTS de cuántica<\/td><\/tr><tr><td>Informàtica I + II<\/td><td>Métodos numéricos para todos, no solo la mención Fonamental<\/td><\/tr><tr><td>5 menciones + itinerario libre<\/td><td>Identidad clara; 27 ECTS libres, 87 sin mención<\/td><\/tr><tr><td>Menciones porosas<\/td><td>Cambiar tras 3.º es viable en 18 de 20 combinaciones<\/td><\/tr><tr><td>Grupos compartidos entre cursos<\/td><td>Una optativa = un grupo por cuatrimestre, aunque mezcle 3.º y 4.º<\/td><\/tr><\/table><\/div>\n<h2 id=\"v-puntos-a-vigilar\">Puntos a vigilar<\/h2>\n<h3 id=\"v-matematicas\">Matemáticas<\/h3>\n<div class=\"tbl\"><table><tr><th>Punto<\/th><th>Por qué importa<\/th><th>Propuesta o pregunta abierta<\/th><\/tr><tr><td>MM II llega tarde (Fourier, Sturm-Liouville)<\/td><td>Òptica I y Quàntica I los usan a la vez; EM I (Legendre/Bessel) antes<\/td><td>Pasarlos a MM I (otoño 2.º)<\/td><\/tr><tr><td>Probabilidad partida<\/td><td>Discreta en Àlgebra lineal, continua en MM I; sin inferencia ni ajuste<\/td><td>Un bloque único y reforzado (≈4 ECTS)<\/td><\/tr><tr><td>Duplicidades<\/td><td>EDCV ↔ MM II (Frobenius, Green), MM I ↔ MM II (Fourier/Laplace), CDV ↔ MM I (complejos)<\/td><td>Tabla tema → asignatura única<\/td><\/tr><tr><td>Espacios y análisis complejos<\/td><td>Quàntica necesita espacios complejos y operadores hermíticos; hoy empiezan en MM II, tarde<\/td><td>¿En Àlgebra lineal o en otra asignatura? ¿Hasta dónde la variable compleja? (propuesta: ≈2 ECTS de residuos y Kramers-Kronig)<\/td><\/tr><tr><td>Primer cuatrimestre<\/td><td>18 de 30 ECTS de matemáticas con enfoque muy formal<\/td><td>Mismo volumen, ejemplos físicos, menos formalismo<\/td><\/tr><tr><td>Criterio de contenidos<\/td><td>Evitar dar teoremas que no se usan<\/td><td>Al tronco solo si lo usan ≥2 asignaturas o requiere práctica<\/td><\/tr><tr><td>Itinerario teórico<\/td><td>Que el teórico no se quede corto sin que todos “pasen por el tubo”<\/td><td>Bloque optativo con MMA I/II y optativas de Matemàtiques<\/td><\/tr><\/table><\/div>\n<h3 id=\"v-laboratorios\">Laboratorios<\/h3>\n<div class=\"tbl\"><table><tr><th>Punto<\/th><th>Por qué importa<\/th><th>Propuesta o pregunta abierta<\/th><\/tr><tr><td>Prerrequisito de teoría<\/td><td>Evitar que el laboratorio vaya por delante de la teoría<\/td><td>Matriculado o superada la teoría. ¿Parte I o parte II?<\/td><\/tr><tr><td>Recursos (+9 ECTS comunes)<\/td><td>Espacio, material y profesorado<\/td><td>Estudio de capacidad antes de fijar grupos<\/td><\/tr><\/table><\/div>\n<h3 id=\"v-contenidos-y-secuencia\">Contenidos y secuencia<\/h3>\n<div class=\"tbl\"><table><tr><th>Punto<\/th><th>Por qué importa<\/th><th>Propuesta o pregunta abierta<\/th><\/tr><tr><td>Circuitos en FEiO<\/td><td>Los laboratorios de 2.º los necesitan<\/td><td>Mantenerlos en FEiO<\/td><\/tr><tr><td>Estado Sólido antes que Física Estadística (MCSC, TF)<\/td><td>Necesita Fermi-Dirac<\/td><td>Estado Sólido a 7.º<\/td><\/tr><tr><td>Solapamientos (EM, Óptica y otros)<\/td><td>Temas repetidos o dados por vistos<\/td><td>Matriz de coordinación entre asignaturas<\/td><\/tr><tr><td>TF, 6.º semestre<\/td><td>Hueco de 3 ECTS sin optativa de 3 en ese cuatrimestre<\/td><td>Ajustar el hueco u ofrecer una de 3<\/td><\/tr><\/table><\/div>\n<h3 id=\"v-organizacion-y-recursos\">Organización y recursos<\/h3>\n<div class=\"tbl\"><table><tr><th>Punto<\/th><th>Por qué importa<\/th><th>Propuesta o pregunta abierta<\/th><\/tr><tr><td>Parrilla horaria<\/td><td>Grupos compartidos entre menciones y cursos para ahorrar recursos<\/td><td>Parrilla antes de cerrar menciones<\/td><\/tr><tr><td>Optativas por cuatrimestre<\/td><td>Compartir grupo exige un cuatrimestre fijo<\/td><td>¿Todas en un único cuatrimestre o oferta en ambos, como ahora?<\/td><\/tr><tr><td>Evaluación<\/td><td>Muchas asignaturas de 3 ECTS<\/td><td>¿Más evaluación continua? Contar asignaturas por cuatrimestre sin los laboratorios<\/td><\/tr><tr><td>Volumen por asignatura<\/td><td>Viabilidad de grupos y optativas<\/td><td>Predicción de matrícula<\/td><\/tr><tr><td>Otras facultades y EET<\/td><td>Horarios y plazas que no dependen de Física<\/td><td>Coordinación con esos centros<\/td><\/tr><\/table><\/div>\n<h3 id=\"v-implantacion\">Implantación<\/h3>\n<div class=\"tbl\"><table><tr><th>Punto<\/th><th>Por qué importa<\/th><th>Propuesta o pregunta abierta<\/th><\/tr><tr><td>Transición entre grados<\/td><td>Convivencia de planes y reconocimiento de lo ya aprobado<\/td><td>Tabla de adaptación y calendario de extinción<\/td><\/tr><tr><td>Abandono en 1.º<\/td><td>Ya es alto (≈24 %)<\/td><td>Seguimiento con el valor actual como umbral (ver sección de matemáticas)<\/td><\/tr><\/table><\/div>\n<h2 id=\"v-dependencias-entre-asignaturas-de-1-y-2\">Dependencias entre asignaturas de 1.º y 2.º<\/h2>\n<figure class=\"w\" data-w=\"deps\"><span class=\"live\">interactivo<\/span><div class=\"mount\"><\/div><figcaption>Dependencias deducidas de los temarios de matemáticas propuestos y de los planes docentes actuales (2026-27); semestres de la presentación del 23/09/2026<\/figcaption><\/figure>\n<p>Cada flecha va de la asignatura que aporta un contenido a la que lo usa. Verde: llega un semestre antes o más. Ámbar: se dan a la vez. Rojo: el contenido llega después de necesitarse. En morado discontinuo, contenido que se repite entre dos asignaturas. Los temas de las flechas son una primera aproximación: conviene revisarlos con cada plan docente cuando estén cerrados.<\/p>\n<h2 id=\"v-matematicas-en-1-cuanto-riesgo\">Matemáticas en 1.º: ¿cuánto riesgo?<\/h2>\n<p><strong>Conclusión: el volumen <\/strong><strong>de matemáticas es asumible, pero Física UB ya parte de un abandono alto (23–25 % en los tres últimos cursos), así<\/strong><strong> que <\/strong><strong>el p<\/strong><strong>rimer curso no tiene margen para más riesgo: hay que acompañarlo<\/strong><strong>.<\/strong><\/p>\n<figure class=\"w\" data-w=\"primer\"><div class=\"mount\"><\/div><figcaption>Plan de estudios GETI ETSEIB 2026-27 (“Química y otras” = Química I+II y Expressió Gràfica); ficha del grado UB y presentación del 23/09/2026<\/figcaption><\/figure>\n<p>Las ingenierías de la UPC dedican 1.º y parte de 2.º a ciencias básicas (matemáticas, física, química) y dejan la materia propia para después. La propuesta de Física no sigue ese modelo: tiene física desde el primer día (24 ECTS con laboratorio) aunque más matemáticas.<\/p>\n<div class=\"tbl\"><table><tr><th>Dato<\/th><th>Cifra<\/th><\/tr><tr><td><strong>Física UB, tasa de abandono<\/strong><\/td><td><strong>16,5 % (21-22) · 24,9 % (22-23) · 24,3 % (23-24) · 23,5 % (24-25)<\/strong><\/td><\/tr><tr><td><strong>Física UB, tasa de rendimiento<\/strong><\/td><td><strong>79,4 % · 85,3 % · 78,8 % · 74,2 %<\/strong> (misma serie)<\/td><\/tr><tr><td>UPC, todos los grados: dejan la titulación tras 1.º (cohorte 2018-19)<\/td><td>20,9 % (16,4 % deja la UPC + 4,4 % cambia de estudio)<\/td><\/tr><tr><td>UPC: superan la fase inicial en el tiempo previsto (cohorte 2016-17)<\/td><td>41,8 % (32,2 % más, con un año extra)<\/td><\/tr><tr><td>UPC: siguen matriculados tras 1.º, según vía de acceso<\/td><td>Bachillerato 80,9 % · CFGS 68,8 %<\/td><\/tr><tr><td>Tecnologies Industrials ETSEIB, abandono en 1.º (nota de corte 10,7)<\/td><td>5,8–6,0 % (2011-13)<\/td><\/tr><tr><td>Ingenierías industriales catalanas, abandono en 1.º (AQU, 2018)<\/td><td>De 5,2 % a 43,6 % según el grado<\/td><\/tr><tr><td>Media del sistema universitario catalán (2015-16)<\/td><td>≈17 %<\/td><\/tr><\/table><\/div>\n<p><strong>Lectura:<\/strong><\/p>\n<ul><li>Física UB está <strong>por encima<\/strong> de la media catalana (≈17 %) y de la UPC en conjunto (20,9 %). El rendimiento cae 11 puntos en dos cursos (85,3 % → 74,2 %).<\/li><li>La titulación UPC con más matemáticas en 1.º de la comparación tiene de los abandonos más bajos: el porcentaje de matemáticas no explica por sí solo el abandono; pesan más el perfil de entrada, la vía de acceso y una fase inicial selectiva.<\/li><li>Conclusión práctica: el nuevo 1.º no es el problema, pero no puede añadir dificultad sin acompañamiento.<\/li><\/ul>\n<p><strong>Qué haría:<\/strong><\/p>\n<ul><li>Desglosar el abandono de Física UB por asignatura de 1.º y por nota/vía de acceso para saber dónde se pierde al alumnado hoy.<\/li><li>Mantener el volumen de matemáticas, con ritmo progresivo, ejemplos físicos y tutoría o mentoría en el primer cuatrimestre.<\/li><li>Fijar como alerta el valor actual (≈24 % de abandono, 74 % de rendimiento): si la primera cohorte lo empeora, se revisa el enfoque de 1.º.<\/li><li>Aplicar el criterio de herramienta: al tronco solo lo que usan dos o más obligatorias o lo que requiere práctica.<\/li><\/ul>\n<h2 id=\"v-prioridades\">Prioridades<\/h2>\n<figure class=\"w\" data-w=\"prio\"><div class=\"mount\"><\/div><figcaption>Valoración cualitativa propia · 13 propuestas<\/figcaption><\/figure>\n<h2 id=\"v-fuentes\">Fuentes<\/h2>\n<ul><li><a href=\"https://www.ub.edu/grad/infes/fitxaInfe.jsp?n0=L&amp;n1=0&amp;n2=1&amp;tipus=&amp;curs=2026&amp;ens=TG1035\" target=\"_blank\" rel=\"noopener\">Ficha del Grau de Física UB 2026-27<\/a> y planes docentes; presentación <em>Proposta provisional del nou grau en Física<\/em> (23/09/2026)<\/li><li><a href=\"https://www.upc.edu/grau/ca/242/grau-en-enginyeria-en-tecnologies-industrials-barcelona-etseib.pdf\" target=\"_blank\" rel=\"noopener\">Plan de estudios GETI, ETSEIB-UPC<\/a><\/li><li><a href=\"https://govern.upc.edu/ca/consell-de-govern/consell-de-govern/sessio-07-2019-del-consell-de-govern/comissio-de-docencia-i-estudiantat/informe-sobre-el-rendiment-academic-de-l2019estudiantat-abandonament-el-1r-any-d2019estudis/informe-sobre-el-rendiment-academic-de-l2019estudiantat-abandonament-el-1r-any-d2019estudis/@@display-file/visiblefile/11.2.%20Informe%20%20rendiment%20acad%C3%A8mic%20estudiantat,%20abandonament%20el%201r%20any.pdf\" target=\"_blank\" rel=\"noopener\">Informe UPC sobre abandono en el primer año (Comissió de Docència, 5/12/2019)<\/a><\/li><li><a href=\"https://etseib.upc.edu/ca/lescola/qualitat/sistema-de-garantia-interna-de-la-qualitat/taules/taules-graus/copy13_of_nou-ingres-geti\" target=\"_blank\" rel=\"noopener\">Abandono 1.º GETI, ETSEIB<\/a><\/li><li><a href=\"https://www.aqu.cat/doc/Enginyeries-de-l-ambit-Industrial-i-la-Logistica\" target=\"_blank\" rel=\"noopener\">AQU, Informe d’avaluació transversal: enginyeries de l’àmbit industrial (2018)<\/a><\/li><li><a href=\"https://diaridigital.urv.cat/taxa-abandonament-estudis-grau/\" target=\"_blank\" rel=\"noopener\">URV, taxa d’abandonament (media del sistema catalán)<\/a><\/li><\/ul>", "vtoc": [["v-el-cambio-en-un-grafico", "El cambio en un gráfico"], ["v-fortalezas", "Fortalezas"], ["v-puntos-a-vigilar", "Puntos a vigilar"], ["v-dependencias-entre-asignaturas-de-1-y-2", "Dependencias entre asignaturas de 1.º y 2.º"], ["v-matematicas-en-1-cuanto-riesgo", "Matemáticas en 1.º: ¿cuánto riesgo?"], ["v-prioridades", "Prioridades"], ["v-fuentes", "Fuentes"]]}, "ca": {"funciona": "<p><strong>Dos anys comuns per construir la base, dos anys per especialitzar-se.<\/strong> El grau té 240 ECTS: els dos primers cursos i part del tercer són iguals per a tothom; a partir del 5è semestre cada estudiant tria menció o itinerari lliure.<\/p>\n<div class=\"tbl\"><table><tr><th>Bloc<\/th><th>ECTS<\/th><th>Quan<\/th><\/tr><tr><td>Formació bàsica<\/td><td>60<\/td><td>1r<\/td><\/tr><tr><td>Obligatòries comunes<\/td><td>87<\/td><td>2n i 3r<\/td><\/tr><tr><td>Menció i optatives<\/td><td>87<\/td><td>3r i 4t<\/td><\/tr><tr><td>Treball de Fi de Grau<\/td><td>6<\/td><td>4t, primavera<\/td><\/tr><\/table><\/div>\n<p><em>Document basat en la proposta provisional del 23/09/2026. Els temaris, l’avaluació i algunes optatives encara s’estan debatent.<\/em><\/p>\n<h2 id=\"f-mapa-del-grau\">Mapa del grau<\/h2>\n<figure class=\"w\" data-w=\"mapa\"><div class=\"mount\"><\/div><figcaption>Mapa del grau per semestres<\/figcaption><\/figure>\n<p>Cada laboratori és una assignatura independent de 3 ECTS que es matricula a banda de la teoria: Lab Ia, Ib i Ic a 2n (Mecànica, EM i Termodinàmica) i Lab IIa i IIb a 3r (Òptica i Quàntica). Quin laboratori ocupa cada franja està per decidir.<\/p>\n<h2 id=\"f-les-materies-troncals\">Les matèries troncals<\/h2>\n<figure class=\"w\" data-w=\"tronc\"><div class=\"mount\"><\/div><figcaption>Matèries troncals: teoria i laboratori<\/figcaption><\/figure>\n<ul><li><strong>Fonaments<\/strong> són un primer contacte més qualitatiu amb tota la física clàssica.<\/li><li><strong>Mecànica i Electromagnetisme<\/strong> passen de 7,5 a 12 ECTS de teoria: Mecànica conserva tot el contingut actual i guanya profunditat; EM absorbeix part del que deixa Fonaments i amplia ones i propagació.<\/li><li><strong>Òptica i Termodinàmica<\/strong> passen a 9 ECTS de teoria.<\/li><li><strong>Quàntica II<\/strong> (≈ l’actual Mecànica Quàntica) passa a ser comuna.<\/li><li>Cada laboratori val <strong>3 ECTS<\/strong> i es matricula a banda.<\/li><\/ul>\n<h2 id=\"f-com-es-construeix-una-mencio\">Com es construeix una menció<\/h2>\n<figure class=\"w\" data-w=\"mencio\"><div class=\"mount\"><\/div><figcaption>Composició d&#x27;una menció<\/figcaption><\/figure>\n<h2 id=\"f-les-cinc-mencions\">Les cinc mencions<\/h2>\n<div class=\"tbl\"><table><tr><th>Menció<\/th><th>Obligatòries de menció<\/th><th>ECTS<\/th><th>Optatives mín.<\/th><\/tr><tr><td><strong>Astrofísica<\/strong><\/td><td>Mecànica Teòrica · Relativitat Especial i Camps Clàssics · Astrofísica estel·lar · Física Atòmica i Molecular · Astrofísica galàctica i extragalàctica · Plasmes i Processos Astrofísics · Astrofísica observacional · Cosmologia<\/td><td>39<\/td><td>21<\/td><\/tr><tr><td><strong>Física del Sistema Terra<\/strong><\/td><td>Física de medis continus · Física de l’atmosfera · Geofísica · Dinàmica de fluids geofísics · Geodinàmica · Fon. Científics del Canvi Climàtic · Sistemes complexos i física interdisciplinària<\/td><td>36<\/td><td>24<\/td><\/tr><tr><td><strong>Matèria Condensada i Sistemes Complexos<\/strong><\/td><td>Física de medis continus · Mecànica Teòrica · Física de l’Estat Sòlid · Fenòmens Col·lectius i Transicions de Fase · Lab. Estat Sòlid · Sistemes Fora de l’Equilibri · Sistemes complexos i física interdisciplinària<\/td><td>39<\/td><td>21<\/td><\/tr><tr><td><strong>Quàntica i Interaccions Fonamentals<\/strong><\/td><td>Relativitat Especial i Camps Clàssics · Mecànica Teòrica · Física Atòmica i Molecular · Física Nuclear i Hadrònica · Física de Partícules · Laboratori de menció<\/td><td>36<\/td><td>24<\/td><\/tr><tr><td><strong>Tecnologies Físiques<\/strong><\/td><td>Instrumentació Física · Física de l’Estat Sòlid · Física Atòmica i Molecular · Fotònica · Física de Semiconductors · Laboratori de Tecnologies Físiques<\/td><td>36<\/td><td>24<\/td><\/tr><\/table><\/div>\n<p>Moltes assignatures es repeteixen entre mencions (Mecànica Teòrica en tres, Física Atòmica i Molecular en tres). Això és el que permet canviar de menció sense perdre crèdits.<\/p>\n<p>Abreviatures que es fan servir més avall: <strong>Astro<\/strong> = Astrofísica · <strong>Terra<\/strong> = Física del Sistema Terra · <strong>MCSC<\/strong> = Matèria Condensada i Sistemes Complexos · <strong>QIF<\/strong> = Quàntica i Interaccions Fonamentals · <strong>TF<\/strong> = Tecnologies Físiques.<\/p>\n<h3 id=\"f-que-comparteixen-les-mencions\">Què comparteixen les mencions<\/h3>\n<figure class=\"w\" data-w=\"euler\"><span class=\"live\">interactiu<\/span><div class=\"mount\"><\/div><figcaption>Diagrama de conjunts de les mencions (interactiu)<\/figcaption><\/figure>\n<p>Com llegir-lo: clica les mencions de la llegenda per mostrar només les que vulguis comparar (per exemple, Astrofísica i Quàntica); les assignatures que no pertanyen a cap de les seleccionades queden en gris i el comptador indica quantes en comparteixen. Cada assignatura és dins dels contorns de totes les mencions a què pertany. Si a més cau a la zona ombrejada d’una menció, hi és obligatòria. Atòmica i Molecular, al centre, és a les cinc.<\/p>\n<figure class=\"w\" data-w=\"red\"><div class=\"mount\"><\/div><figcaption>Assignatures compartides entre mencions · presentació del nou grau<\/figcaption><\/figure>\n<figure class=\"w\" data-w=\"matriz\"><div class=\"mount\"><\/div><figcaption>Les 46 assignatures de menció · presentació del nou grau<\/figcaption><\/figure>\n<p>Les assignatures de dalt són les que connecten mencions: Física Atòmica i Molecular és a les cinc i Mecànica Teòrica a quatre. Les de baix són les que donen identitat a cadascuna.<\/p>\n<p>A més de les 46 assignatures de menció hi ha <strong>optatives transversals<\/strong>, que no pertanyen a cap menció i compten com a crèdits lliures: Història de la Física (6), Pràctiques en Empresa (6), Gènere, Ciència i Tecnologia (3) i, per confirmar, Didàctica de la Ciència (3). Fonaments Científics del Canvi Climàtic (3), obligatòria a Terra, també s’ofereix com a transversal.<\/p>\n<h2 id=\"f-canviar-de-mencio\">Canviar de menció<\/h2>\n<figure class=\"w\" data-w=\"viab\"><span class=\"live\">interactiu<\/span><div class=\"mount\"><\/div><figcaption>Viabilitat del canvi de menció (interactiu: 5è / 6è semestre)<\/figcaption><\/figure>\n<ul><li><strong>Com llegir-la:<\/strong> clica el botó del moment del canvi (després del 5è o després del 6è semestre). Fila = menció en què va començar l’estudiant; columna = la menció a la qual vol canviar. Cada cel·la indica quants ECTS de les assignatures fixes de menció ja cursades continuen comptant.<\/li><li><strong>Després del 5è semestre<\/strong> el canvi és viable en les 20 combinacions: només s’han cursat 6–12 ECTS de menció i queden 75 ECTS optatius.<\/li><li><strong>Després del 6è semestre<\/strong> és viable en 18 de 20: només fallen Terra → QIF i Terra → TF.<\/li><li>El que no compta per a la nova menció no es perd: va als 27 ECTS lliures.<\/li><li>Si el canvi arriba tard i no es completen els 60 ECTS, queda l’<strong>itinerari lliure<\/strong>: s’obté el títol amb els mateixos coneixements, sense el nom de la menció.<\/li><li>Les optatives de 3r que triï l’estudiant poden millorar molt aquestes xifres si ja dubta entre dues mencions.<\/li><\/ul>\n<h2 id=\"f-laboratoris\">Laboratoris<\/h2>\n<figure class=\"w\" data-w=\"labs\"><div class=\"mount\"><\/div><figcaption>Itinerari de laboratori<\/figcaption><\/figure>\n<p>Cada laboratori és una assignatura pròpia de 3 ECTS, no anual, perquè qui repeteix una assignatura no quedi desquadrat. Requisit previst: estar matriculat o haver superat la teoria corresponent. La franja de cada laboratori i el repartiment de pràctiques encara s’estan decidint.<\/p>\n<h2 id=\"f-que-encara-esta-en-debat\">Què encara està en debat<\/h2>\n<div class=\"tbl\"><table><tr><th>Tema<\/th><th>Què està decidit<\/th><th>Què falta<\/th><\/tr><tr><td>Fonaments I i II<\/td><td>Seran més qualitatius (“tast”)<\/td><td>Quins temes es redueixen i com<\/td><\/tr><tr><td>Temaris i plans docents<\/td><td>Crèdits per assignatura<\/td><td>Continguts, coordinació entre assignatures i avaluació<\/td><\/tr><tr><td>Matemàtiques<\/td><td>42 ECTS obligatoris<\/td><td>Enfocament, ordre dels continguts, pes de la probabilitat i de la variable complexa<\/td><\/tr><tr><td>Laboratoris<\/td><td>3 ECTS per bloc, matrícula a banda<\/td><td>Quin laboratori (Ia–IIb) va a cada franja, prerequisit amb la part I o II de la teoria i repartiment de pràctiques<\/td><\/tr><tr><td>Optatives<\/td><td>Bateries de cada menció<\/td><td>Algunes optatives no lligades a menció poden caure o canviar de crèdits<\/td><\/tr><tr><td>Calendari<\/td><td>Semestre de cada assignatura (provisional)<\/td><td>Ajustar les que canvien de quadrimestre segons la menció<\/td><\/tr><\/table><\/div>", "ftoc": [["f-mapa-del-grau", "Mapa del grau"], ["f-les-materies-troncals", "Les matèries troncals"], ["f-com-es-construeix-una-mencio", "Com es construeix una menció"], ["f-les-cinc-mencions", "Les cinc mencions"], ["f-canviar-de-mencio", "Canviar de menció"], ["f-laboratoris", "Laboratoris"], ["f-que-encara-esta-en-debat", "Què encara està en debat"]], "valoracion": "<p><strong>Veredicte: disseny coherent i defensable; els riscos són d’execució, no de concepte.<\/strong><\/p>\n<ul><li><strong>Aposta:<\/strong> menys física de panorama al tronc, més profunditat a les clàssiques, laboratori amb pes real i molta optativitat.<\/li><li><strong>El que funciona:<\/strong> laboratoris de 3 ECTS, Mecànica i EM de 12 ECTS, Quàntica II per a tothom, mencions poroses (canvi viable en 18 de 20 parelles).<\/li><li><strong>El que cal tancar:<\/strong> seqüenciació i enfocament de les matemàtiques, ordre i cost dels laboratoris, coordinació de temaris, graella horària i transició entre plans.<\/li><\/ul>\n<h2 id=\"v-el-canvi-en-un-grafic\">El canvi en un gràfic<\/h2>\n<figure class=\"w\" data-w=\"dumbbell\"><div class=\"mount\"><\/div><figcaption>Fitxa del grau i plans docents UB 2026-27; presentació del 23/09/2026<\/figcaption><\/figure>\n<h2 id=\"v-fortaleses\">Fortaleses<\/h2>\n<div class=\"tbl\"><table><tr><th>Què<\/th><th>Per què importa<\/th><\/tr><tr><td>Laboratori propi de 3 ECTS<\/td><td>Avui val ≈1,5 ECTS diluïts en la teoria; ara es reconeix i s’avalua<\/td><\/tr><tr><td>Mecànica i EM a 12 ECTS, Òptica i Termo a 9<\/td><td>Més profunditat (abans 7,5 de teoria); Mecànica ho conserva tot i hi afegeix<\/td><\/tr><tr><td>Quàntica I (2n) + II (3r) per a tothom<\/td><td>Avui mitja promoció acaba amb 6 ECTS de quàntica<\/td><\/tr><tr><td>Informàtica I + II<\/td><td>Mètodes numèrics per a tothom, no només la menció Fonamental<\/td><\/tr><tr><td>5 mencions + itinerari lliure<\/td><td>Identitat clara; 27 ECTS lliures, 87 sense menció<\/td><\/tr><tr><td>Mencions poroses<\/td><td>Canviar després de 3r és viable en 18 de 20 combinacions<\/td><\/tr><tr><td>Grups compartits entre cursos<\/td><td>Una optativa = un grup per quadrimestre, encara que barregi 3r i 4t<\/td><\/tr><\/table><\/div>\n<h2 id=\"v-punts-a-vigilar\">Punts a vigilar<\/h2>\n<h3 id=\"v-matematiques\">Matemàtiques<\/h3>\n<div class=\"tbl\"><table><tr><th>Punt<\/th><th>Per què importa<\/th><th>Proposta o pregunta oberta<\/th><\/tr><tr><td>MM II arriba tard (Fourier, Sturm-Liouville)<\/td><td>Òptica I i Quàntica I els fan servir alhora; EM I (Legendre/Bessel) abans<\/td><td>Passar-los a MM I (tardor de 2n)<\/td><\/tr><tr><td>Probabilitat partida<\/td><td>Discreta a Àlgebra lineal, contínua a MM I; sense inferència ni ajust<\/td><td>Un bloc únic i reforçat (≈4 ECTS)<\/td><\/tr><tr><td>Duplicitats<\/td><td>EDCV ↔ MM II (Frobenius, Green), MM I ↔ MM II (Fourier/Laplace), CDV ↔ MM I (complexos)<\/td><td>Taula tema → assignatura única<\/td><\/tr><tr><td>Espais i anàlisi complexos<\/td><td>Quàntica necessita espais complexos i operadors hermitians; avui comencen a MM II, tard<\/td><td>A Àlgebra lineal o en una altra assignatura? Fins on la variable complexa? (proposta: ≈2 ECTS de residus i Kramers-Kronig)<\/td><\/tr><tr><td>Primer quadrimestre<\/td><td>18 de 30 ECTS de matemàtiques amb un enfocament molt formal<\/td><td>Mateix volum, exemples físics, menys formalisme<\/td><\/tr><tr><td>Criteri de continguts<\/td><td>Evitar donar teoremes que no es fan servir<\/td><td>Al tronc només si ho fan servir ≥2 assignatures o requereix pràctica<\/td><\/tr><tr><td>Itinerari teòric<\/td><td>Que el teòric no es quedi curt sense que tothom “passi pel tub”<\/td><td>Bloc optatiu amb MMA I/II i optatives de Matemàtiques<\/td><\/tr><\/table><\/div>\n<h3 id=\"v-laboratoris\">Laboratoris<\/h3>\n<div class=\"tbl\"><table><tr><th>Punt<\/th><th>Per què importa<\/th><th>Proposta o pregunta oberta<\/th><\/tr><tr><td>Prerequisit de teoria<\/td><td>Evitar que el laboratori vagi per davant de la teoria<\/td><td>Matriculat o superada la teoria. Part I o part II?<\/td><\/tr><tr><td>Recursos (+9 ECTS comuns)<\/td><td>Espai, material i professorat<\/td><td>Estudi de capacitat abans de fixar grups<\/td><\/tr><\/table><\/div>\n<h3 id=\"v-continguts-i-sequencia\">Continguts i seqüència<\/h3>\n<div class=\"tbl\"><table><tr><th>Punt<\/th><th>Per què importa<\/th><th>Proposta o pregunta oberta<\/th><\/tr><tr><td>Circuits a FEiO<\/td><td>Els laboratoris de 2n els necessiten<\/td><td>Mantenir-los a FEiO<\/td><\/tr><tr><td>Estat Sòlid abans que Física Estadística (MCSC, TF)<\/td><td>Necessita Fermi-Dirac<\/td><td>Estat Sòlid a 7è<\/td><\/tr><tr><td>Encavalcaments (EM, Òptica i altres)<\/td><td>Temes repetits o donats per vistos<\/td><td>Matriu de coordinació entre assignatures<\/td><\/tr><tr><td>TF, 6è semestre<\/td><td>Forat de 3 ECTS sense optativa de 3 en aquell quadrimestre<\/td><td>Ajustar el forat o oferir-ne una de 3<\/td><\/tr><\/table><\/div>\n<h3 id=\"v-organitzacio-i-recursos\">Organització i recursos<\/h3>\n<div class=\"tbl\"><table><tr><th>Punt<\/th><th>Per què importa<\/th><th>Proposta o pregunta oberta<\/th><\/tr><tr><td>Graella horària<\/td><td>Grups compartits entre mencions i cursos per estalviar recursos<\/td><td>Graella abans de tancar les mencions<\/td><\/tr><tr><td>Optatives per quadrimestre<\/td><td>Compartir grup exigeix un quadrimestre fix<\/td><td>Totes en un únic quadrimestre o oferta en tots dos, com ara?<\/td><\/tr><tr><td>Avaluació<\/td><td>Moltes assignatures de 3 ECTS<\/td><td>Més avaluació continuada? Comptar assignatures per quadrimestre sense els laboratoris<\/td><\/tr><tr><td>Volum per assignatura<\/td><td>Viabilitat de grups i optatives<\/td><td>Predicció de matrícula<\/td><\/tr><tr><td>Altres facultats i EET<\/td><td>Horaris i places que no depenen de Física<\/td><td>Coordinació amb aquests centres<\/td><\/tr><\/table><\/div>\n<h3 id=\"v-implantacio\">Implantació<\/h3>\n<div class=\"tbl\"><table><tr><th>Punt<\/th><th>Per què importa<\/th><th>Proposta o pregunta oberta<\/th><\/tr><tr><td>Transició entre graus<\/td><td>Convivència de plans i reconeixement del que ja s’ha aprovat<\/td><td>Taula d’adaptació i calendari d’extinció<\/td><\/tr><tr><td>Abandonament a 1r<\/td><td>Ja és alt (≈24 %)<\/td><td>Seguiment amb el valor actual com a llindar (vegeu la secció de matemàtiques)<\/td><\/tr><\/table><\/div>\n<h2 id=\"v-dependencies-entre-assignatures-de-1r-i-\">Dependències entre assignatures de 1r i 2n<\/h2>\n<figure class=\"w\" data-w=\"deps\"><span class=\"live\">interactiu<\/span><div class=\"mount\"><\/div><figcaption>Dependències deduïdes dels temaris de matemàtiques proposats i dels plans docents actuals (2026-27); semestres de la presentació del 23/09/2026<\/figcaption><\/figure>\n<p>Cada fletxa va de l’assignatura que aporta un contingut a la que el fa servir. Verd: arriba un semestre abans o més. Ambre: es donen alhora. Vermell: el contingut arriba després de necessitar-se. En lila discontinu, contingut que es repeteix entre dues assignatures. Els temes de les fletxes són una primera aproximació: convindrà revisar-los amb cada pla docent quan estiguin tancats.<\/p>\n<h2 id=\"v-matematiques-a-1r-quant-de-risc\">Matemàtiques a 1r: quant de risc?<\/h2>\n<p><strong>Conclusió: el volum de matemàtiques és assumible, però Física UB ja parteix d’un abandonament alt (23–25 % els tres darrers cursos), així que el primer curs no té marge per a més risc: cal acompanyar-lo.<\/strong><\/p>\n<figure class=\"w\" data-w=\"primer\"><div class=\"mount\"><\/div><figcaption>Pla d’estudis GETI ETSEIB 2026-27 (“Química i altres” = Química I+II i Expressió Gràfica); fitxa del grau UB i presentació del 23/09/2026<\/figcaption><\/figure>\n<p>Les enginyeries de la UPC dediquen 1r i part de 2n a ciències bàsiques (matemàtiques, física, química) i deixen la matèria pròpia per a després. La proposta de Física no segueix aquest model: té física des del primer dia (24 ECTS amb laboratori), tot i que més matemàtiques.<\/p>\n<div class=\"tbl\"><table><tr><th>Dada<\/th><th>Xifra<\/th><\/tr><tr><td><strong>Física UB, taxa d’abandonament<\/strong><\/td><td><strong>16,5 % (21-22) · 24,9 % (22-23) · 24,3 % (23-24) · 23,5 % (24-25)<\/strong><\/td><\/tr><tr><td><strong>Física UB, taxa de rendiment<\/strong><\/td><td><strong>79,4 % · 85,3 % · 78,8 % · 74,2 %<\/strong> (mateixa sèrie)<\/td><\/tr><tr><td>UPC, tots els graus: deixen la titulació després de 1r (cohort 2018-19)<\/td><td>20,9 % (16,4 % deixa la UPC + 4,4 % canvia d’estudi)<\/td><\/tr><tr><td>UPC: superen la fase inicial en el temps previst (cohort 2016-17)<\/td><td>41,8 % (32,2 % més, amb un any extra)<\/td><\/tr><tr><td>UPC: segueixen matriculats després de 1r, segons via d’accés<\/td><td>Batxillerat 80,9 % · CFGS 68,8 %<\/td><\/tr><tr><td>Tecnologies Industrials ETSEIB, abandonament a 1r (nota de tall 10,7)<\/td><td>5,8–6,0 % (2011-13)<\/td><\/tr><tr><td>Enginyeries industrials catalanes, abandonament a 1r (AQU, 2018)<\/td><td>Del 5,2 % al 43,6 % segons el grau<\/td><\/tr><tr><td>Mitjana del sistema universitari català (2015-16)<\/td><td>≈17 %<\/td><\/tr><\/table><\/div>\n<p><strong>Lectura:<\/strong><\/p>\n<ul><li>Física UB està <strong>per sobre<\/strong> de la mitjana catalana (≈17 %) i de la UPC en conjunt (20,9 %). El rendiment cau 11 punts en dos cursos (85,3 % → 74,2 %).<\/li><li>La titulació UPC amb més matemàtiques a 1r de la comparació té dels abandonaments més baixos: el percentatge de matemàtiques no explica per si sol l’abandonament; hi pesen més el perfil d’entrada, la via d’accés i una fase inicial selectiva.<\/li><li>Conclusió pràctica: el nou 1r no és el problema, però no pot afegir dificultat sense acompanyament.<\/li><\/ul>\n<p><strong>Què faria:<\/strong><\/p>\n<ul><li>Desglossar l’abandonament de Física UB per assignatura de 1r i per nota/via d’accés per saber on es perd l’alumnat avui.<\/li><li>Mantenir el volum de matemàtiques, amb ritme progressiu, exemples físics i tutoria o mentoria el primer quadrimestre.<\/li><li>Fixar com a alerta el valor actual (≈24 % d’abandonament, 74 % de rendiment): si la primera cohort l’empitjora, es revisa l’enfocament de 1r.<\/li><li>Aplicar el criteri d’eina: al tronc només el que fan servir dues o més obligatòries o el que requereix pràctica.<\/li><\/ul>\n<h2 id=\"v-prioritats\">Prioritats<\/h2>\n<figure class=\"w\" data-w=\"prio\"><div class=\"mount\"><\/div><figcaption>Valoració qualitativa pròpia · 13 propostes<\/figcaption><\/figure>\n<h2 id=\"v-fonts\">Fonts<\/h2>\n<ul><li><a href=\"https://www.ub.edu/grad/infes/fitxaInfe.jsp?n0=L&amp;n1=0&amp;n2=1&amp;tipus=&amp;curs=2026&amp;ens=TG1035\" target=\"_blank\" rel=\"noopener\">Fitxa del Grau de Física UB 2026-27<\/a> i plans docents; presentació <em>Proposta provisional del nou grau en Física<\/em> (23/09/2026)<\/li><li><a href=\"https://www.upc.edu/grau/ca/242/grau-en-enginyeria-en-tecnologies-industrials-barcelona-etseib.pdf\" target=\"_blank\" rel=\"noopener\">Pla d’estudis GETI, ETSEIB-UPC<\/a><\/li><li><a href=\"https://govern.upc.edu/ca/consell-de-govern/consell-de-govern/sessio-07-2019-del-consell-de-govern/comissio-de-docencia-i-estudiantat/informe-sobre-el-rendiment-academic-de-l2019estudiantat-abandonament-el-1r-any-d2019estudis/informe-sobre-el-rendiment-academic-de-l2019estudiantat-abandonament-el-1r-any-d2019estudis/@@display-file/visiblefile/11.2.%20Informe%20%20rendiment%20acad%C3%A8mic%20estudiantat,%20abandonament%20el%201r%20any.pdf\" target=\"_blank\" rel=\"noopener\">Informe UPC sobre l’abandonament el primer any (Comissió de Docència, 5/12/2019)<\/a><\/li><li><a href=\"https://etseib.upc.edu/ca/lescola/qualitat/sistema-de-garantia-interna-de-la-qualitat/taules/taules-graus/copy13_of_nou-ingres-geti\" target=\"_blank\" rel=\"noopener\">Abandonament 1r GETI, ETSEIB<\/a><\/li><li><a href=\"https://www.aqu.cat/doc/Enginyeries-de-l-ambit-Industrial-i-la-Logistica\" target=\"_blank\" rel=\"noopener\">AQU, Informe d’avaluació transversal: enginyeries de l’àmbit industrial (2018)<\/a><\/li><li><a href=\"https://diaridigital.urv.cat/taxa-abandonament-estudis-grau/\" target=\"_blank\" rel=\"noopener\">URV, taxa d’abandonament (mitjana del sistema català)<\/a><\/li><\/ul>", "vtoc": [["v-el-canvi-en-un-grafic", "El canvi en un gràfic"], ["v-fortaleses", "Fortaleses"], ["v-punts-a-vigilar", "Punts a vigilar"], ["v-dependencies-entre-assignatures-de-1r-i-", "Dependències entre assignatures de 1r i 2n"], ["v-matematiques-a-1r-quant-de-risc", "Matemàtiques a 1r: quant de risc?"], ["v-prioritats", "Prioritats"], ["v-fonts", "Fonts"]]}};
